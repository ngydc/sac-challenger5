# Start:   docker compose up --build          -> http://localhost:4200 (dev, live reload)
# Prod:    docker compose --profile prod up --build frontend-prod   -> http://localhost:8080
services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "4200:4200"
    environment:
      API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep the container's Linux node_modules, don't use the host's
    depends_on:
      - backend # the dev server proxies /api to it
    restart: unless-stopped

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
    ports:
      - "8080:80"
    depends_on:
      - backend # nginx proxies /api to it
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sac_password}
      POSTGRES_DB: ${POSTGRES_DB:-sac}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sac}:${POSTGRES_PASSWORD:-sac_password}@db:5432/${POSTGRES_DB:-sac}
      # epoch maps of positions other than the five test targets live in cache/temp and are cleaned up:
      SPHEREX_TEMP_CACHE_TTL_HOURS: ${SPHEREX_TEMP_CACHE_TTL_HOURS:-72} # removed after this long without use
      SPHEREX_TEMP_CACHE_MAX_MB: ${SPHEREX_TEMP_CACHE_MAX_MB:-2000} # least recently used go first above this size
    volumes:
      - ./backend/app:/code/app
      - ./backend/cache:/code/cache # persistent cache (epoch maps, cutouts, calibration files): survives restarts and rebuilds
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Runs once at start-up: fills cache/examples (raw cutouts, intermediate steps, all products) for the five
  # test targets, then exits. That tree is permanent: nothing deletes it automatically.
  # Only what is missing is computed, so a restart with a filled cache takes seconds. The backend serves the
  # results as they appear; it does not wait for this.
  precompute:
    build: ./backend
    volumes:
      - ./backend/app:/code/app
      - ./backend/cache:/code/cache
    command: python -m app.precompute
    restart: "no"

volumes:
  pgdata:
