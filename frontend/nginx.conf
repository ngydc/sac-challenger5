server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the backend container. Resolving at request time
  # (Docker DNS + variable) lets nginx start even if the backend isn't up yet.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $backend http://backend:8000;
  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Angular routing: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
