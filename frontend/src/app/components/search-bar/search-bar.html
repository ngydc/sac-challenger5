<form role="search" class="glass" (submit)="submit($event)" (focusin)="show()" (focusout)="onFocusOut($event)" (keydown)="onKey($event)">
  <label for="q" class="sr-only">Object name or coordinates</label>
  <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
  <span class="field">
    <input
      #q
      id="q"
      type="search"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="suggest"
      aria-describedby="q-hint"
      [attr.aria-expanded]="open()"
      [attr.aria-activedescendant]="marked() >= 0 ? 'sg-' + marked() : null"
      autocomplete="off"
      spellcheck="false"
      maxlength="120"
      [value]="text()"
      (input)="text.set($any($event.target).value); show()"
      (click)="show()"
    />
    <!-- The placeholder: a real example that changes every few seconds (fades in, so it is a span, not the
         placeholder attribute). Only while the box is empty. -->
    <span id="q-hint" class="sr-only">Type an object name or coordinates, for example {{ hints[0] }} or {{ hints[1] }}.</span>
    @if (!text()) {
      @for (h of [hint()]; track h) {
        <span class="example-hint" aria-hidden="true">e.g. <span class="num-ish">{{ h }}</span></span>
      }
    }
  </span>
  <button type="submit" class="btn" [class.primary]="s.phase() !== 'resolving'" [disabled]="!text().trim() || s.phase() === 'resolving'">
    @if (s.phase() === 'resolving') {
      <app-logo [size]="22" [spin]="true" /><span class="sr-only">Searching</span>
    } @else {
      Show
    }
  </button>

  @if (open()) {
    <div id="suggest" class="suggest glass" role="listbox" aria-label="Suggestions">
      @for (o of suggestions(); track $index) {
        @if (o.first) {
          <p class="kicker">{{ o.recent ? 'Recent searches' : 'Example targets' }}</p>
        }
        <!-- mousedown is cancelled so the input keeps the focus until the click arrives -->
        <button
          type="button"
          role="option"
          class="opt"
          tabindex="-1"
          [id]="'sg-' + $index"
          [class.marked]="marked() === $index"
          [attr.aria-selected]="marked() === $index"
          (mousedown)="$event.preventDefault()"
          (mouseenter)="marked.set($index)"
          (click)="run(o.query)"
        >
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
            @if (o.recent) {
              <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2" />
            } @else {
              <path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.3l6.1-.7z" />
            }
          </svg>
          <span>{{ o.query }}</span>
        </button>
      }
    </div>
  }
</form>
